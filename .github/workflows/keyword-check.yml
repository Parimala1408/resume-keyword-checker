name: Resume Keyword Check

on:
  push:
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Run keyword checker
        run: python keyword_check.py
